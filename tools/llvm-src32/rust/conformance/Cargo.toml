[package]
name = "src32-rust-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
cpt32 = { path = "../../../../sdk/rust/cpt32" }

[features]
# main panics (index out of bounds) through cpt32's handler instead of running the checks.
panic = []

[profile.release]
opt-level = 2

[profile.dev]
opt-level = 0
