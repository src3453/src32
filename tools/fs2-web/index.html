<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FS2 シリアル転送</title><style>body{font:16px system-ui;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#17243b}label{display:block;margin:1rem 0}input{display:block;padding:.5rem;width:100%;box-sizing:border-box}button{padding:.7rem 1.2rem;background:#1755a6;color:white;border:0;border-radius:4px;margin-right:.5rem}#drop{border:2px dashed #7794ba;padding:1.5rem;text-align:center}#drop.active{background:#e4efff}pre{white-space:pre-wrap}small{color:#555}</style><h1>FS2 シリアル転送</h1><p>ボードをリセットして BIOS モニターに入り、SDカードのファイルを転送します。</p><form id="form"><label>シリアルポート<input name="port" placeholder="COM7" required></label><label>ボーレート<input name="baud" type="number" value="3000000" min="1" required></label><label>FS2 内のファイルの絶対パス<input name="path" placeholder="/home/example.bin" required></label><div id="drop">アップロードするファイルをここへドロップ、または<input name="file" type="file"></div><p><button type="submit">アップロード</button><button type="button" id="download">ダウンロードを準備</button></p></form><p><a id="save" hidden draggable="true">ファイルを保存（クリックまたは対応ブラウザーでドラッグ）</a></p><p><small>アップロードは既存ファイルを上書きします。転送完了まで電源や接続を切らないでください。</small></p><pre id="status" role="status"></pre><script>
const form=document.getElementById('form'), msg=document.getElementById('status'), drop=document.getElementById('drop'), save=document.getElementById('save'), download=document.getElementById('download');
let selected=null, objectUrl=null;
form.elements.file.onchange=()=>{selected=form.elements.file.files[0]};
for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('active')});
for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('active')});
drop.addEventListener('drop',e=>{selected=e.dataTransfer.files[0];if(selected){msg.textContent='選択: '+selected.name;if(!form.elements.path.value)form.elements.path.value='/'+selected.name}});
async function transfer(kind){if(!form.reportValidity())return;const f=new FormData(form), buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);save.hidden=true;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}msg.textContent='読み込み・検証・転送中です。お待ちください…';try{let req={port:f.get('port'),baud:f.get('baud'),path:f.get('path')};if(kind==='update'){if(!selected)throw Error('ファイルを選択してください');const bytes=new Uint8Array(await selected.arrayBuffer());let parts=[];for(let i=0;i<bytes.length;i+=32768)parts.push(String.fromCharCode(...bytes.subarray(i,i+32768)));req.data=btoa(parts.join(''))}const res=await fetch('/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});const result=await res.json();if(!result.ok)throw Error(result.message);if(kind==='download'){const binary=atob(result.data), bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));objectUrl=URL.createObjectURL(new Blob([bytes]));save.href=objectUrl;save.download=req.path.split('/').pop()||'download';save.hidden=false;msg.textContent='ダウンロードの準備ができました。下のリンクをクリックするかドラッグしてください。'}else msg.textContent=result.message}catch(err){msg.textContent='失敗: '+err.message}finally{buttons.forEach(b=>b.disabled=false)}}
form.onsubmit=e=>{e.preventDefault();transfer('update')};download.onclick=()=>transfer('download');save.ondragstart=e=>{e.dataTransfer.setData('DownloadURL','application/octet-stream:'+save.download+':'+save.href)};
</script></html>
