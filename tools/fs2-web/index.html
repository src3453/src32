<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FS2 シリアル更新</title><style>body{font:16px system-ui;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#17243b}label{display:block;margin:1rem 0}input{display:block;padding:.5rem;width:100%;box-sizing:border-box}button{padding:.7rem 1.2rem;background:#1755a6;color:white;border:0;border-radius:4px}pre{white-space:pre-wrap}small{color:#555}</style><h1>FS2 シリアル更新</h1><p>ボードをリセットして BIOS モニターに入り、SDカードのファイルを更新します。Foundation 実行中は使用できません。</p><form id="form"><label>シリアルポート<input name="port" placeholder="COM7" required></label><label>ボーレート<input name="baud" type="number" value="3000000" min="1" required></label><label>FS2 内の保存先（絶対パス）<input name="path" placeholder="/home/example.bin" required></label><label>アップロードするファイル<input name="file" type="file" required></label><button>更新</button></form><p><small>既存ファイルは上書きされます。読み込みと検証には時間がかかります。完了まで電源や接続を切らないでください。</small></p><pre id="status" role="status"></pre><script>
const form=document.getElementById('form'), status=document.getElementById('status');
form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),button=form.querySelector('button');button.disabled=true;status.textContent='読み込み・検証・更新中です。お待ちください…';try{const bytes=new Uint8Array(await f.get('file').arrayBuffer());let parts=[];for(let i=0;i<bytes.length;i+=32768)parts.push(String.fromCharCode(...bytes.subarray(i,i+32768)));const res=await fetch('/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port:f.get('port'),baud:f.get('baud'),path:f.get('path'),data:btoa(parts.join(''))})});const result=await res.json();status.textContent=(result.ok?'成功: ':'失敗: ')+result.message}catch(err){status.textContent='通信エラー: '+err.message}finally{button.disabled=false}};
</script></html>
