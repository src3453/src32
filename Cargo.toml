[package]
name = "cpt32"
version = "0.1.0"
edition = "2024"
default-run = "cpt32"


[[bin]]
name = "cpt32-tool"
path = "src/bin/cpt32_tool.rs"
[dependencies]
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
wgpu = "29.0.3" # 30.x will raise compatibility error on imgui-wgpu
winit = "0.30.13"
cpal = "0.18.2"
tokio = { version = "1.53.2", features = ["rt", "sync"] }
gilrs = "0.11"
imgui = { version = "0.12.0", features = ["tables-api"] }
imgui-winit-support = "0.13.0"
imgui-wgpu = "0.28.0"
wasmtime = { version = "30.0.2", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate-miniz"] }
directories = "6.0.0"
sha2 = "0.10.9"
crc32c = "0.6.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wat = "1.246.2"