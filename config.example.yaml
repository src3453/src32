# Copy this file to config.yaml and uncomment only the settings you use.

# Log verbosity: trace, debug, info, warn, error, or off (default: info).
# logging:
#   level: debug

# BIOS ROM image (POST + IPL, runs from 0xFF000000, 64 KiB max).
# Build it with: sol/bios.sol header commands -> assets/bios.rom.
# Relative paths are resolved from the directory containing config.yaml.
# Omit this section to boot the guest program straight from RAM at 0x0.
# NOTE: the ROM loader is not implemented yet; nothing reads this key.
#bios:
#  image: "assets/bios.rom"

pcg:
  # Raw PCG font bank image: exactly 2 KiB (one bank) or 4 KiB (both banks).
  # Relative paths are resolved from the directory containing config.yaml.
  # font: "assets/font.bin"

# Connect up to four raw disk images. Relative paths are resolved from the
# directory containing config.yaml. Each configured image must already exist.
# disk:
#   - slot: 0
#     type: "hdd" # "fdd" or "hdd"
#     image: "disk0.img"
#     read_only: true
#     transfer_rate_bytes_per_second: 48000000
#     access_latency_ms: 0
#     # Operation sound profile (internal_name from the asset pack below).
#     # Omit to keep the slot silent.
#     sound_profile: "Seagate_ST3120A_3211RPM"

# Disk operation sounds (spindle hum + seek clicks). Sound samples are NOT
# bundled: because of their licenses, check out
# https://github.com/86Box/assets yourself and point asset_root at the
# directory containing its sounds/ folder (it also provides
# sounds/hdd/hdd_audio_profiles.cfg and sounds/fdd/fdd_audio_profiles.cfg).
# Without an asset pack (or without sound_profile assignments) the emulator
# stays silent; a broken sound setup only warns and never fails to boot.
# disk_sound:
#   asset_root: "assets-86box"
#   volume: 1.0 # global gain, 0.0 (muted) .. 4.0
#   default_fdd_profile: "panasonic_ju4755_40t"
#   default_hdd_profile: "Seagate_ST3120A_3211RPM"

# WASM expansion cards use ZIP packages with a root manifest.yaml.
# Assets are decompressed only when the guest first reads them.
# expansion_card:
#   - slot: 0
#     package: "plugins/timer.cpt32card"
